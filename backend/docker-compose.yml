services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: swat_tour
      POSTGRES_USER: swat_tour
      POSTGRES_PASSWORD: local_development_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swat_tour -d swat_tour"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
